<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Falling rocks background -->
    <div class="falling-rocks" id="fallingRocks"></div>

    <!-- Home Page -->
    <div class="page active" id="home">
        <div class="content">
            <h1 class="title">Welcome to Stone</h1>
            
            <!-- Hover menu button -->
            <div class="menu-container">
                <div class="menu-button">
                    <div class="button-text">Menu</div>
                </div>
                <div class="menu-options">
                    <div class="menu-item" data-page="games">Games</div>
                    <div class="menu-item" data-page="apps">Apps</div>
                    <div class="menu-item" data-page="credits">Credits</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Games Page -->
    <div class="page" id="games">
        <div class="content">
            <h1 class="title">Games</h1>
            <p>Welcome to the Games section!</p>
            <button class="back-button" data-page="home">Back to Home</button>
        </div>
    </div>

    <!-- Apps Page -->
    <div class="page" id="apps">
        <div class="content">
            <h1 class="title">Apps</h1>
            <p>Welcome to the Apps section!</p>
            <button class="back-button" data-page="home">Back to Home</button>
        </div>
    </div>

    <!-- Credits Page -->
    <div class="page" id="credits">
        <div class="content">
            <h1 class="title">Credits</h1>
            <p>Website created for Stone</p>
            <button class="back-button" data-page="home">Back to Home</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
